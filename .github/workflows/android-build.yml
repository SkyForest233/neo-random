name: Android Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  # 关键：网页「Draft a new release / Publish release」触发的是 release 事件，
  # 而不是 tag push 事件。缺这个触发器会导致网页发布的 Release 不构建 APK。
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 签名：从 GitHub Secrets 解码 keystore（未配置时自动回退 debug 签名）
      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/neo-release.jks
            ls -la $RUNNER_TEMP/neo-release.jks
          else
            echo "::warning::未检测到 KEYSTORE_BASE64 secret，本次将使用 debug 签名（可安装，但每次构建签名不一致）"
          fi

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/neo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME#v}"
            ./gradlew assembleRelease --stacktrace \
              -PVERSION_NAME="$TAG_NAME" \
              -PVERSION_CODE="${{ github.run_number }}"
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p output
          if [ -d app/build/outputs/apk/release ]; then
            cp app/build/outputs/apk/release/app-release.apk "output/NEO-RNG-${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "output/NEO-RNG-debug-${GITHUB_SHA::7}.apk"
          fi
          ls -la output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-rng-apk
          path: output/*.apk

      # 网页「Publish release」（release 事件）：Release 已存在，只上传 APK，
      # 不改动用户自己写的 release notes。
      - name: Attach APK to existing Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk

      # tag push 场景：Release 尚不存在，创建并自动生成说明。
      - name: Create GitHub Release
        if: github.event_name != 'release' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
