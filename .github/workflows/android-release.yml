name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/neo-release.jks
          ls -la $RUNNER_TEMP/neo-release.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/neo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "::warning::未检测到 KEYSTORE_BASE64 secret，将使用 debug 签名（可直接安装，但每次构建签名不一致）"
          fi
          TAG_NAME="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$TAG_NAME" =~ ^[0-9]+\.[0-9]+ ]]; then
            ./gradlew assembleRelease --stacktrace \
              -PVERSION_NAME="$TAG_NAME" \
              -PVERSION_CODE="${{ github.run_number }}"
          else
            ./gradlew assembleRelease --stacktrace \
              -PVERSION_CODE="${{ github.run_number }}"
          fi

      - name: Collect APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk "output/NEO-RNG-${GITHUB_REF_NAME}.apk"
          ls -la output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-rng-release
          path: output/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
